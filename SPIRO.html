<div id="app">
  <!-- 1. Map stage: the first thing on the page -->
  <section id="intro" class="intro" hidden aria-labelledby="introTitle" tabindex="-1"></section>
  <main id="mapStage" class="stage">
    <div class="map-wrap">
      <div id="map" role="region" aria-label="Map of the Philippines with Metro Manila highlighted"></div>
      <div id="mapFallback" class="map-fallback" hidden></div>

      <!-- Primary map controls, in order: layer toggle, search, date/time -->
      <div class="ctrl-col" id="ctrlCol">
        <div class="ctrl-card ctrl-mode">
          <button type="button" id="backBtn" class="hamb back-btn" aria-label="Back to the first screen" title="Back"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></button>
          <button type="button" id="navBtn" class="hamb" aria-label="Open menu" aria-expanded="false" aria-controls="navPanel"><span class="hb" aria-hidden="true"><i></i><i></i><i></i></span></button>
          <div class="seg layer-seg" id="layerSeg" role="radiogroup" aria-label="Map layer"></div>
        </div>
        <div class="ctrl-card ctrl-find" role="search">
          <label class="ctrl-title" for="topFind" id="topFindLbl">Search Location</label>
          <div class="top-search">
            <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="topFind" type="search" placeholder="Type a city, mall or facility" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="topFindList">
            <ul id="topFindList" class="ts-list" role="listbox" aria-labelledby="topFindLbl" hidden></ul>
          </div>
          <p class="ts-msg" id="topFindMsg" hidden role="status"></p>
        </div>
        <section class="ctrl-card ctrl-time" id="timeBox" aria-labelledby="timeTitle"></section>
        <!-- LGU Admin tools, shown only after logging in -->
        <nav class="ctrl-card ctrl-admin" id="adminBox" aria-labelledby="adminBoxTitle" hidden></nav>
      </div>
      <a class="logo-ph" href="#intro" aria-label="SPIRO, open the introduction" title="About SPIRO"><img class="logo" src="assets/img/spiro-logo.png" alt="" width="256" height="256"><b>SPIRO</b></a>
      <!-- Takes the logo's place while the LGU admin is logged in -->
      <button type="button" class="logo-ph top-logout" id="topLogout" aria-label="Log out" title="Log out" hidden><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg><b>Log out</b></button>

      <!-- Map controls and legend share the bottom-right corner -->
      <div class="br-stack">
      <div class="map-ctrls" id="mapCtrls" role="group" aria-label="Map controls">
        <button type="button" id="zIn" aria-label="Zoom in" title="Zoom in"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button type="button" id="zOut" aria-label="Zoom out" title="Zoom out"><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button>
        <button type="button" id="zNcr" aria-label="Zoom to Metro Manila" title="Metro Manila"><svg class="i" aria-hidden="true"><use href="#i-target"/></svg></button>
      </div>

      <div id="legend" class="legend" role="region" aria-label="Map legend" aria-live="polite"></div>
      </div>
      <div id="mapStatus" class="map-status" role="status"></div>
      <div id="mapLoading" class="map-loading">Loading map…</div>
    </div>

    <!-- Place details: overlays the map on wide screens, sits under the map on phones -->
    <aside id="placeCard" class="place-card" hidden aria-labelledby="placeTitle"></aside>
  </main>

  <!-- 2. Overlay menu opened by the hamburger -->
  <div id="navScrim" class="scrim" hidden></div>
  <nav id="navPanel" class="nav-panel" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle" tabindex="-1"></nav>

  <!-- 3. Panels: Admin, data dictionary -->
  <div id="sheetScrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" hidden aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="Close panel and return to the map"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

</div>

<!-- Dialogs -->
<div id="modalScrim" class="scrim modal-scrim" hidden></div>
<div id="loginModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>



<!-- Libraries and data -->
<!-- Leaflet stays a classic script: it defines the global L. -->
<script src="assets/vendor/leaflet/leaflet.js"></script>
<!-- App entry: native ES modules (src/main.js wires models, views, controllers). -->
<script type="module" src="src/app.js"></script>
</body>
</html>
